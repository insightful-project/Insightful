# Insightful — Observability stack (Loki + Grafana)
# Loki stores logs pushed via pino-loki transport from NestJS apps.
# Grafana dashboards at http://localhost:3000 (admin / admin).
# Usage: podman compose -f compose/observability.yml up -d

name: observability

networks:
  insightful:
    external: true
    name: insightful

services:
  loki:
    image: docker.io/grafana/loki:3.4
    container_name: insightful-loki
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - insightful
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: docker.io/grafana/grafana:11.5
    container_name: insightful-grafana
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
    depends_on:
      loki:
        condition: service_started
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - insightful
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "-O-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
