# Insightful — Life OS v2 stack (Postgres + NestJS API + Vue PWA)
# CloudBeaver started separately via ./start.sh cloudbeaver
# Usage: podman compose -f compose/lifeos.yml up -d

name: lifeos

networks:
  insightful:
    external: true
    name: insightful

services:
  postgres:
    image: docker.io/postgres:16-alpine
    container_name: lifeos-db
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      POSTGRES_DB: ${LIFEOS_DB:-lifeos}
      POSTGRES_USER: ${LIFEOS_USER:-lifeos_user}
      POSTGRES_PASSWORD: ${LIFEOS_PASSWORD}
    volumes:
      - lifeos-postgres:/var/lib/postgresql/data
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    # 0.0.0.0 for dev access from WSL; production uses Nginx Proxy Manager
    ports:
      - "127.0.0.1:${LIFEOS_DB_PORT:-5434}:5432"
    networks:
      - insightful
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LIFEOS_USER:-lifeos_user} -d ${LIFEOS_DB:-lifeos}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api-nest:
    build:
      context: ../
      dockerfile: dev/ins1ght/products/life-os-v2/server/Dockerfile.nest
    container_name: lifeos-api-nest
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${LIFEOS_NEST_PORT:-4001}:4001"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    environment:
      DATABASE_URL: postgres://${LIFEOS_USER}:${LIFEOS_PASSWORD}@postgres:5432/${LIFEOS_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4001
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - insightful
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4001/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  vue-app:
    build:
      context: ../
      dockerfile: dev/ins1ght/products/life-os-v2/vue/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: lifeos-vue-app
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${LIFEOS_VUE_PORT:-3002}:3000"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    depends_on:
      api-nest:
        condition: service_started
    networks:
      - insightful
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Named volume for Postgres (needs Unix permissions for initdb).
# CloudBeaver workspace uses a project-relative bind mount at data/lifeos/cloudbeaver/.
# Start independently: ./start.sh cloudbeaver  (or included in ./start.sh all)
volumes:
  lifeos-postgres:
