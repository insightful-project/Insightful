# Insightful — code-server (browser-based VS Code)
# Web IDE: http://localhost:8081  (or code.insightful-projects.com via NPM)
# Password: set CODE_SERVER_PASSWORD in compose/.env (default: changeme)

name: code-server

networks:
  insightful:
    external: true
    name: insightful

services:
  code-server:
    image: docker.io/codercom/code-server:4.127.0
    container_name: insightful-code-server
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${CODE_SERVER_PORT:-8081}:8080"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:-changeme}
      DEFAULT_WORKSPACE: /workspace
    volumes:
      - ..:/workspace
    networks:
      - insightful
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
