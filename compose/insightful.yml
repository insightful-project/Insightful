# Insightful — Full stack (aggregate)
# Includes all stacks via 'include:' directives. Same as ./start.sh all.
# Usage: podman compose -f compose/insightful.yml up -d
# Note: odysseus.yml and ollama.yml run locally but are kept out of the repo.

name: insightful

include:
  - lifeos.yml
  - redis.yml
  - observability.yml
  - n8n.yml
  - npm.yml
  - code-server.yml
  - insightful-hub.yml
  - codespace.yml
  - cloudbeaver.yml
  - oauth2.yml
