# Insightful — Nginx Proxy Manager
# Web UI for managing reverse proxy, SSL, and forwarding rules.
# Replaces the manual nginx-ingress.conf setup.
# Admin UI: http://localhost:81  │  Default login: admin@example.com / changeme
# Usage: podman compose -f compose/npm.yml up -d

name: npm

networks:
  insightful:
    external: true
    name: insightful

services:
  npm:
    image: docker.io/jc21/nginx-proxy-manager:2.12.3
    container_name: npm
    restart: unless-stopped
    stop_grace_period: 30s
    # had to ssh into the machine and set the ipv4 privilege to 1 for the container to be able to bind to ports 80 and 443
    ports:
      - "127.0.0.1:${NPM_HTTP_PORT:-80}:80"
      - "127.0.0.1:${NPM_HTTPS_PORT:-443}:443"
      - "127.0.0.1:${NPM_ADMIN_PORT:-81}:81" 
    environment:
      INITIAL_ADMIN_EMAIL: admin@insightful-projects.com
      INITIAL_ADMIN_PASSWORD: ${NPM_ADMIN_PASSWORD:-Insightful2026!}
    volumes:
      - type: bind
        source: ./../data/npm/data
        target: /data
      - type: bind
        source: ./../data/npm/ssl
        target: /etc/letsencrypt
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    networks:
      - insightful
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:81/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
