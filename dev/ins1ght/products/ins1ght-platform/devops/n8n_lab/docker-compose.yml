# n8n Lab — pinned to match production stack (compose/n8n.yml)
# Runs on the shared insightful network; env from compose/.env
services:
  db:
    image: postgres:16-alpine
    container_name: n8n-lab-db
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ../../../../../../compose/.env
    environment:
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-changeme-n8n-db}
      POSTGRES_DB: ${N8N_DB:-n8n}
    ports:
      - "127.0.0.1:${N8N_DB_PORT:-5436}:5432"
    volumes:
      - n8n-lab-postgres:/var/lib/postgresql/data
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n} -d ${N8N_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - insightful
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    image: n8nio/n8n:2.28.5
    container_name: n8n-lab
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: ../../../../../../compose/.env
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-changeme-n8n-db}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_JWT_SECRET}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_HOST: ${N8N_HOST:-n8n.insightful-projects.com}
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${WEBHOOK_URL:-http://n8n.insightful-projects.com/}
      NODE_ENV: production
      GENERIC_TIMEZONE: UTC
      N8N_METRICS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_LOG_LEVEL: info
      N8N_BINARY_DATA_MODE: default
      EXECUTIONS_MODE: regular
      EXECUTIONS_PROCESS: main
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:${N8N_PORT:-5678}"
    volumes:
      - n8n-lab-data:/home/node/.n8n
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    depends_on:
      db:
        condition: service_healthy
    networks:
      - insightful
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${N8N_PORT:-5678}/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  n8n-lab-postgres:
  n8n-lab-data:

networks:
  insightful:
    external: true
    name: insightful